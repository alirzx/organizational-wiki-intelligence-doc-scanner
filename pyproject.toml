[project]
name = "wiki-hami-extraction"
version = "0.2.0"
description = "Wiki Hami V1 image-based document detection and extraction service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "pillow>=10.4,<12",
  "numpy>=1.26,<3",
  "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
]
ui = [
  "streamlit>=1.38,<2",
  "requests>=2.32,<3",
]
models = [
  "paddleocr>=3.5,<4",
  "rfdetr>=1.8,<2",
  "huggingface_hub>=0.34,<2",
]
grouping = [
  "httpx>=0.27,<1",
  "lightgbm>=4,<5",
  "scikit-learn>=1.5,<2",
]
grouping-training = [
  "httpx>=0.27,<1",
  "lightgbm>=4,<5",
  "scikit-learn>=1.5,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
